name: Checkpoint

run-name: "checkpoint: ${{ github.event.inputs.name || github.event.inputs.bin_list || github.event.inputs.bin }}"

on:
  workflow_dispatch:
    inputs:
      name:
        description: Workload name, required only for single-bin mode
        required: false
        type: string
      bin:
        description: Absolute path to a GCPT-bootable bin for single-bin mode
        required: false
        type: string
      bin_list:
        description: Absolute path to a text file listing one bin path per line
        required: false
        type: string
      archive_id:
        description: Existing archive id for single-bin resume
        required: false
        type: string
      interval:
        description: Checkpoint interval
        required: false
        default: "20000000"
        type: string
      max_workers:
        description: Maximum parallel workloads used in batch mode
        required: false
        default: "3"
        type: string
      resume_after:
        description: Resume mode, use auto with bin_list to reuse previous archives
        required: false
        default: ""
        type: string
      allow_new_archives:
        description: Allow auto resume to create archives for missing previous runs
        required: false
        default: "false"
        type: boolean
      rebuild_nemu:
        description: Rebuild only NEMU before running the checkpoint flow
        required: false
        default: "false"
        type: boolean
      nemu_home:
        description: Optional NEMU directory override
        required: false
        type: string
      nemu_defconfig:
        description: Defconfig used when rebuilding NEMU
        required: false
        default: "riscv64-xs-cpt_defconfig"
        type: string

jobs:
  run-single-bin-checkpoint:
    runs-on: self-hosted
    timeout-minutes: 2880
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Run checkpoint flow
        working-directory: checkpoint_scripts
        shell: bash
        run: |
          set -euo pipefail

          ENV_SCRIPT="/nfs/home/share/workload_env/env.sh"
          if [[ ! -r "$ENV_SCRIPT" ]]; then
            echo "ERROR: missing environment script: $ENV_SCRIPT"
            exit 1
          fi
          source "$ENV_SCRIPT"

          BIN_PATH="${{ github.event.inputs.bin }}"
          BIN_LIST_PATH="${{ github.event.inputs.bin_list }}"
          WORKLOAD_NAME="${{ github.event.inputs.name }}"
          ARCHIVE_ID_INPUT="${{ github.event.inputs.archive_id }}"
          INTERVAL="${{ github.event.inputs.interval }}"
          MAX_WORKERS="${{ github.event.inputs.max_workers }}"
          RESUME_AFTER="${{ github.event.inputs.resume_after }}"
          ALLOW_NEW_ARCHIVES="${{ github.event.inputs.allow_new_archives }}"
          REBUILD_NEMU="${{ github.event.inputs.rebuild_nemu }}"
          NEMU_OVERRIDE_HOME="${{ github.event.inputs.nemu_home }}"
          NEMU_DEFCONFIG="${{ github.event.inputs.nemu_defconfig }}"

          if [[ -n "$NEMU_OVERRIDE_HOME" ]]; then
            if [[ ! -d "$NEMU_OVERRIDE_HOME" ]]; then
              echo "ERROR: NEMU override directory does not exist: $NEMU_OVERRIDE_HOME"
              exit 1
            fi
            export NEMU_HOME="$NEMU_OVERRIDE_HOME"
          fi

          if [[ -n "$BIN_PATH" && -n "$BIN_LIST_PATH" ]]; then
            echo "ERROR: provide either 'bin' or 'bin_list', not both"
            exit 1
          fi

          if [[ -n "$BIN_LIST_PATH" && -n "$ARCHIVE_ID_INPUT" ]]; then
            echo "ERROR: archive_id can only be used with single-bin mode"
            exit 1
          fi

          if [[ -z "$BIN_PATH" && -z "$BIN_LIST_PATH" ]]; then
            echo "ERROR: either 'bin' or 'bin_list' must be provided"
            exit 1
          fi

          if [[ ! "$INTERVAL" =~ ^[0-9]+$ ]] || [[ "$INTERVAL" -le 0 ]]; then
            echo "ERROR: interval must be a positive integer, got: $INTERVAL"
            exit 1
          fi

          if [[ ! "$MAX_WORKERS" =~ ^[0-9]+$ ]] || [[ "$MAX_WORKERS" -le 0 ]]; then
            echo "ERROR: max_workers must be a positive integer, got: $MAX_WORKERS"
            exit 1
          fi

          if [[ -n "$RESUME_AFTER" && "$RESUME_AFTER" != "auto" && "$RESUME_AFTER" != "profiling" && "$RESUME_AFTER" != "cluster" ]]; then
            echo "ERROR: resume_after must be empty, auto, profiling, or cluster; got: $RESUME_AFTER"
            exit 1
          fi

          if [[ -n "$RESUME_AFTER" && "$RESUME_AFTER" != "auto" && -z "$ARCHIVE_ID_INPUT" ]]; then
            echo "ERROR: archive_id is required for single-bin resume_after=$RESUME_AFTER"
            exit 1
          fi

          if [[ "$ALLOW_NEW_ARCHIVES" != "true" && "$ALLOW_NEW_ARCHIVES" != "false" ]]; then
            echo "ERROR: allow_new_archives must be true or false, got: $ALLOW_NEW_ARCHIVES"
            exit 1
          fi

          EXTRA_ARGS=()
          if [[ -n "$RESUME_AFTER" ]]; then
            EXTRA_ARGS+=(--resume-after "$RESUME_AFTER")
          fi
          if [[ "$ALLOW_NEW_ARCHIVES" == "true" ]]; then
            EXTRA_ARGS+=(--allow-new-archives)
          fi

          if [[ "$REBUILD_NEMU" == "true" ]]; then
            if [[ -z "$NEMU_HOME" ]]; then
              echo "ERROR: NEMU_HOME is not set after loading env.sh"
              exit 1
            fi
            if [[ ! -d "$NEMU_HOME" ]]; then
              echo "ERROR: NEMU_HOME does not exist: $NEMU_HOME"
              exit 1
            fi
            if [[ -z "$NEMU_DEFCONFIG" ]]; then
              echo "ERROR: nemu_defconfig must not be empty when rebuilding NEMU"
              exit 1
            fi

            echo "INFO: rebuilding NEMU at $NEMU_HOME"
            echo "INFO: nemu_defconfig=$NEMU_DEFCONFIG"
            (
              cd "$NEMU_HOME"
              make "$NEMU_DEFCONFIG"
              make -j
              git submodule update --init
              cd "$NEMU_HOME/resource/gcpt_restore" && make -j
              cd "$NEMU_HOME/resource/simpoint/simpoint_repo" && make -j
            )
          fi

          if [[ -n "$BIN_PATH" ]]; then
            if [[ -n "$ARCHIVE_ID_INPUT" ]]; then
              ARCHIVE_ID="$ARCHIVE_ID_INPUT"
            else
              ARCHIVE_STAMP="$(date +%Y%m%d-%H%M%S)"
              ARCHIVE_SAFE_NAME="$(printf '%s' "$WORKLOAD_NAME" | tr -cs 'A-Za-z0-9._-' '-')"
              ARCHIVE_ID="${ARCHIVE_SAFE_NAME}-${ARCHIVE_STAMP}"
            fi

            if [[ -z "$WORKLOAD_NAME" ]]; then
              echo "ERROR: 'name' is required when using 'bin'"
              exit 1
            fi

            if [[ ! -f "$BIN_PATH" ]]; then
              echo "ERROR: input bin does not exist: $BIN_PATH"
              exit 1
            fi

            echo "INFO: workload=$WORKLOAD_NAME"
            echo "INFO: bin=$BIN_PATH"
            echo "INFO: interval=$INTERVAL"
            echo "INFO: archive_id=$ARCHIVE_ID"

            bash run_single_bin_checkpoint.sh \
              --bin "$BIN_PATH" \
              --name "$WORKLOAD_NAME" \
              --archive-id "$ARCHIVE_ID" \
              --interval "$INTERVAL" \
              "${EXTRA_ARGS[@]}"

            {
              echo "## Single-Bin Checkpoint Result"
              echo ""
              echo "- name: \`$WORKLOAD_NAME\`"
              echo "- bin: \`$BIN_PATH\`"
              echo "- interval: \`$INTERVAL\`"
              echo "- max_workers: \`$MAX_WORKERS\`"
              echo "- resume_after: \`${RESUME_AFTER:-fresh}\`"
              echo "- allow_new_archives: \`$ALLOW_NEW_ARCHIVES\`"
              echo "- archive_id: \`$ARCHIVE_ID\`"
              echo "- archive_dir: \`$GITHUB_WORKSPACE/checkpoint_scripts/archive/$ARCHIVE_ID\`"
              echo "- rebuild_nemu: \`$REBUILD_NEMU\`"
              echo "- nemu_home: \`${NEMU_OVERRIDE_HOME:-$NEMU_HOME}\`"
              echo "- nemu_defconfig: \`$NEMU_DEFCONFIG\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            if [[ ! -f "$BIN_LIST_PATH" ]]; then
              echo "ERROR: bin list file does not exist: $BIN_LIST_PATH"
              exit 1
            fi

            ENTRY_COUNT="$(grep -Evc '^[[:space:]]*(#|$)' "$BIN_LIST_PATH" || true)"

            echo "INFO: bin_list=$BIN_LIST_PATH"
            echo "INFO: entries=$ENTRY_COUNT"
            echo "INFO: interval=$INTERVAL"
            echo "INFO: max_workers=$MAX_WORKERS"

            bash run_single_bin_checkpoint.sh \
              --bin-list "$BIN_LIST_PATH" \
              --interval "$INTERVAL" \
              --max-workers "$MAX_WORKERS" \
              "${EXTRA_ARGS[@]}"

            {
              echo "## Batch Checkpoint Result"
              echo ""
              echo "- bin_list: \`$BIN_LIST_PATH\`"
              echo "- entries: \`$ENTRY_COUNT\`"
              echo "- interval: \`$INTERVAL\`"
              echo "- max_workers: \`$MAX_WORKERS\`"
              echo "- resume_after: \`${RESUME_AFTER:-fresh}\`"
              echo "- allow_new_archives: \`$ALLOW_NEW_ARCHIVES\`"
              echo "- rebuild_nemu: \`$REBUILD_NEMU\`"
              echo "- nemu_home: \`${NEMU_OVERRIDE_HOME:-$NEMU_HOME}\`"
              echo "- nemu_defconfig: \`$NEMU_DEFCONFIG\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
